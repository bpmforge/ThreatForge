name: Threat Model Check

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/**'
      - 'server/**'
      - 'frontend/**'
      - 'Dockerfile*'
      - 'docker-compose*'
      - '*.prisma'
      - 'cli/**'
      - '**/*.threat-model.y*ml'
      - '**/threatforge.y*ml'

jobs:
  threat-check:
    name: Threat Model Freshness
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check threat model freshness
        id: check
        run: |
          # Find threat model docs
          MODELS=$(find docs -name "*.threat-model.*" -o -name "THREAT_MODEL*" 2>/dev/null | head -5)

          # Get files changed in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Check if PR touches security-sensitive files
          SECURITY_FILES=$(echo "$CHANGED" | grep -E "auth|security|middleware|login|password|token|session|encrypt|secret|api-key|webhook" || true)
          API_FILES=$(echo "$CHANGED" | grep -E "src/api/|routes/|endpoints/" || true)
          DB_FILES=$(echo "$CHANGED" | grep -E "prisma|migration|schema|\.sql" || true)
          INFRA_FILES=$(echo "$CHANGED" | grep -E "Dockerfile|docker-compose|nginx|\.env|deploy" || true)

          # Build comment
          COMMENT=""
          NEEDS_REVIEW=false

          if [ -n "$SECURITY_FILES" ]; then
            COMMENT="$COMMENT\n### 🔒 Security-Sensitive Files Changed\n"
            COMMENT="$COMMENT\nThese files affect authentication, authorization, or security:\n"
            COMMENT="$COMMENT\n\`\`\`\n$SECURITY_FILES\n\`\`\`\n"
            COMMENT="$COMMENT\n**Recommended:** Run \`/security\` to check for vulnerabilities.\n"
            NEEDS_REVIEW=true
          fi

          if [ -n "$API_FILES" ]; then
            COMMENT="$COMMENT\n### 🌐 API Changes\n"
            COMMENT="$COMMENT\nAPI routes modified — verify threat model covers new endpoints:\n"
            COMMENT="$COMMENT\n\`\`\`\n$API_FILES\n\`\`\`\n"
            NEEDS_REVIEW=true
          fi

          if [ -n "$DB_FILES" ]; then
            COMMENT="$COMMENT\n### 🗄️ Database Changes\n"
            COMMENT="$COMMENT\nSchema/migration changes — check data access controls:\n"
            COMMENT="$COMMENT\n\`\`\`\n$DB_FILES\n\`\`\`\n"
            NEEDS_REVIEW=true
          fi

          if [ -n "$INFRA_FILES" ]; then
            COMMENT="$COMMENT\n### 🐳 Infrastructure Changes\n"
            COMMENT="$COMMENT\nDeployment/infrastructure changed — review threat model:\n"
            COMMENT="$COMMENT\n\`\`\`\n$INFRA_FILES\n\`\`\`\n"
            NEEDS_REVIEW=true
          fi

          if [ "$NEEDS_REVIEW" = true ]; then
            HEADER="## ⚠️ Threat Model Review Recommended\n\n"
            HEADER="${HEADER}This PR modifies files that may affect the security posture.\n"
            FOOTER="\n---\n*Automated by [ThreatForge](https://github.com/${{ github.repository }})*"
            echo "comment<<EOF" >> $GITHUB_OUTPUT
            echo -e "${HEADER}${COMMENT}${FOOTER}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "needs_review=true" >> $GITHUB_OUTPUT
          else
            echo "needs_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.check.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.check.outputs.comment }}`;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.body?.includes('Threat Model Review Recommended')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  ftm-validate:
    name: ftm validate (unmitigated CRITICAL gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Build @threatforge/cli
        working-directory: cli
        run: npm ci && npm run build

      - name: Validate threat models
        run: |
          MODELS=$(git ls-files '*.threat-model.yaml' '*.threat-model.yml' 'threatforge.yaml' 'threatforge.yml' '**/threatforge.yaml' '**/threatforge.yml' | grep -v '^cli/test/' || true)
          if [ -z "$MODELS" ]; then
            echo "No threat model YAML files found; nothing to validate."
            exit 0
          fi
          STATUS=0
          for f in $MODELS; do
            echo "::group::ftm validate $f"
            node cli/dist/cli.js validate "$f" --fail-on CRITICAL || STATUS=$?
            echo "::endgroup::"
          done
          exit $STATUS
