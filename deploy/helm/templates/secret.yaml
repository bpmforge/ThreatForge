{{/*
This secret is only rendered when secrets.existingSecret is not set AND
at least one secret value has been supplied. In production, prefer creating
an external secret (e.g. via External Secrets Operator or Vault) and setting
secrets.existingSecret to its name so no sensitive data passes through Helm.
*/}}
{{- if not .Values.secrets.existingSecret -}}
{{- if or .Values.secrets.authSecret .Values.secrets.jwtSecret .Values.secrets.encryptionKey .Values.secrets.databaseUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threatforge.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "threatforge.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.authSecret }}
  AUTH_SECRET: {{ .Values.secrets.authSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
