version: '3.8'

networks:
  # Internal network for DB and backend communication
  backend:
    driver: bridge
  # Shared network with nginx reverse proxy (nginx container joins this externally)
  frontend:
    external: true
    name: threatforge_frontend

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpass}
      POSTGRES_DB: ${POSTGRES_DB:-flowthreat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowuser} -d ${POSTGRES_DB:-flowthreat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (BullMQ job queue + real-time collaboration)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init: schema push, seed, first-admin bootstrap (all idempotent).
  # `docker compose up` runs it to completion before the API starts, so a fresh
  # clone reaches a working login page with no manual steps. A deploy script
  # that starts server/frontend with --no-deps skips it.
  init:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowuser}:${POSTGRES_PASSWORD:-flowpass}@db:5432/${POSTGRES_DB:-flowthreat}
      # First system admin. DEMO DEFAULTS - override both in .env, or sign in
      # once and change the password (npm run admin:rotate-password).
      # No defaults: a published default password would become a live
      # super-admin on any install that forgot to set these.
      INITIAL_SYSTEM_ADMIN_EMAIL: ${INITIAL_SYSTEM_ADMIN_EMAIL:-}
      INITIAL_SYSTEM_ADMIN_PASSWORD: ${INITIAL_SYSTEM_ADMIN_PASSWORD:-}

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    networks:
      backend:
      frontend:
        aliases:
          - server
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowuser}:${POSTGRES_PASSWORD:-flowpass}@db:5432/${POSTGRES_DB:-flowthreat}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://frontend:3000}
      # AUTH_URL for verifying sessions with the frontend container
      AUTH_URL: http://frontend:3000
      # Redis for async AI job queue (BullMQ) and collaboration presence.
      # Without this, /ai/micro-analysis?async=true falls back to sync and
      # runs for ~5 min, reliably hitting proxy timeouts.
      REDIS_URL: redis://redis:6379
      # Field-level encryption — set ENCRYPT_AT_REST=true and ENCRYPTION_KEY
      # (openssl rand -base64 32) in the host .env to activate. Off by default
      # here (demo / quickstart stack); docker-compose.prod.yml defaults it ON
      # and refuses to start without a key. The server also refuses to boot
      # with ENCRYPT_AT_REST=true and no valid ENCRYPTION_KEY.
      ENCRYPT_AT_REST: ${ENCRYPT_AT_REST:-false}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Prevent OOM on servers with constrained heap (94% idle heap without this)
      NODE_OPTIONS: "--max-old-space-size=512"
      # Optional BoxyHQ Jackson SAML (see docker-compose.saml.yml).
      AUTH_BOXYHQ_SAML_ISSUER: ${AUTH_BOXYHQ_SAML_ISSUER:-}
      # Read-only accounts (the public demo login) and the AI private-host
      # allowlist. See docs/ADMIN_RUNBOOK.md section 7 before changing.
      DEMO_READONLY_USER_EMAILS: ${DEMO_READONLY_USER_EMAILS:-}
      AI_PRIVATE_HOST_ALLOWLIST: ${AI_PRIVATE_HOST_ALLOWLIST:-}
      AI_ALLOW_ALL_PRIVATE_HOSTS: ${AI_ALLOW_ALL_PRIVATE_HOSTS:-false}
      # Optional: NVD API key (CVE lookups; without it NVD rate-limits to
      # 5 requests per 30 s) and the bearer token that turns on /metrics.
      NVD_API_KEY: ${NVD_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave NEXT_PUBLIC_API_URL empty at build time so browser code uses
        # relative /api/ paths (works for any public domain via nginx proxy).
        # The runtime env sets it to the internal service URL for server-side
        # Next.js API routes that call the backend container directly.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
        USE_POSTGRESQL: "true"
    restart: unless-stopped
    networks:
      backend:
      frontend:
        aliases:
          - frontend
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowuser}:${POSTGRES_PASSWORD:-flowpass}@db:5432/${POSTGRES_DB:-flowthreat}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      # Runtime internal URL for server-side Next.js routes → backend container.
      # Browser uses relative /api/ paths through nginx (no hardcoded URL).
      # INTERNAL_API_URL is read at runtime (not a NEXT_PUBLIC var, so not inlined
      # by `next build`). Kept alongside NEXT_PUBLIC_API_URL for routes not yet
      # migrated to internalBackendUrl().
      INTERNAL_API_URL: http://server:3001
      NEXT_PUBLIC_API_URL: http://server:3001
      NEXT_PUBLIC_WS_URL: ws://server:3001
      AUTH_BOXYHQ_SAML_ISSUER: ${AUTH_BOXYHQ_SAML_ISSUER:-}
      AUTH_BOXYHQ_SAML_ID: ${AUTH_BOXYHQ_SAML_ID:-}
      AUTH_BOXYHQ_SAML_SECRET: ${AUTH_BOXYHQ_SAML_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
