apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowthreat-frontend
  labels:
    app: flowthreat
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flowthreat
      component: frontend
  template:
    metadata:
      labels:
        app: flowthreat
        component: frontend
    spec:
      containers:
        - name: frontend
          image: flowthreat/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: flowthreat-config
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowthreat-secrets
                  key: NEXTAUTH_SECRET
            - name: API_URL
              value: "http://flowthreat-server:4000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flowthreat-frontend
spec:
  selector:
    app: flowthreat
    component: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowthreat-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowthreat-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
