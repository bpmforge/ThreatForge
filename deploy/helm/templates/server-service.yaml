apiVersion: v1
kind: Service
metadata:
  name: {{ include "threatforge.server.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "threatforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "threatforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
