# ConfigMap — non-sensitive configuration
# Apply with: kubectl apply -f configmap-secrets-template.yaml -n flowthreat
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowthreat-config
  namespace: flowthreat
data:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://your-domain.com"
  AUTH_URL: "https://your-domain.com"
  AUTH_TRUST_HOST: "true"
  INTERNAL_API_URL: "http://flowthreat-server:4000"
  NEXT_PUBLIC_API_URL: "http://flowthreat-server:4000"
  REDIS_URL: "redis://redis:6379"
  CORS_ORIGIN: "https://your-domain.com"
  PORT: "4000"
  HOST: "0.0.0.0"
---
# Secret template — copy this, fill in values, base64-encode, then apply
# DO NOT commit the filled-in version to source control
# Encode: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: flowthreat-secrets
  namespace: flowthreat
type: Opaque
data:
  # PostgreSQL
  POSTGRES_USER: <base64-encoded-username>
  POSTGRES_PASSWORD: <base64-encoded-password>
  POSTGRES_DB: <base64-encoded-dbname>
  DATABASE_URL: <base64-encoded-postgresql://user:password@postgres:5432/dbname>
  # Auth
  AUTH_SECRET: <base64-encoded-secret-min-32-chars>
  JWT_SECRET: <base64-encoded-secret-min-32-chars>
  # Encryption (optional — enables field-level AES-256-GCM)
  ENCRYPT_AT_REST: <base64-encoded-true-or-false>
  ENCRYPTION_KEY: <base64-encoded-openssl-rand-base64-32-output>
  # AI providers (add as needed)
  # ANTHROPIC_API_KEY: <base64-encoded-key>
  # OPENAI_API_KEY: <base64-encoded-key>
---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: flowthreat
  labels:
    app: flowthreat
