apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowthreat-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - flowthreat.example.com
      secretName: flowthreat-tls
  rules:
    - host: flowthreat.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flowthreat-server
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowthreat-frontend
                port:
                  number: 80
