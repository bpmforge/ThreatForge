apiVersion: v1
kind: Service
metadata:
  name: {{ include "threatforge.frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "threatforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "threatforge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
