# Production Docker Compose with Nginx reverse proxy and SSL
# Optimized for 4GB RAM servers
#
# Usage:
#   1. Copy .env.prod.example to .env.prod and configure
#   2. Run: ./deploy/setup-server.sh (on target server)
#   3. Run: docker compose -f docker-compose.prod.yml up -d
#
# Memory allocation (4GB total):
#   - PostgreSQL: 512MB
#   - Server API: 384MB
#   - Frontend: 512MB
#   - Nginx: 64MB
#   - System/OS: ~2GB reserved

services:
  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Redis (job queue + collaboration)
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # One-shot init: schema push, seed, first-admin bootstrap (all idempotent).
  # Runs to completion on every `up` before the API starts.
  init:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INITIAL_SYSTEM_ADMIN_EMAIL: ${INITIAL_SYSTEM_ADMIN_EMAIL:?set INITIAL_SYSTEM_ADMIN_EMAIL in .env.prod}
      INITIAL_SYSTEM_ADMIN_PASSWORD: ${INITIAL_SYSTEM_ADMIN_PASSWORD:?set INITIAL_SYSTEM_ADMIN_PASSWORD in .env.prod}
    networks:
      - backend

  # Backend API Server
  server:
    image: threatforge/server:${VERSION:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://${DOMAIN}
      # Auth URL for session validation (internal Docker network)
      AUTH_URL: http://frontend:3000
      LOG_LEVEL: info
      # Node.js memory settings for 4GB server
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=512"
      # Field-level encryption at rest: ON by default in production. Compose
      # refuses to start without ENCRYPTION_KEY (openssl rand -base64 32), and
      # the server refuses to boot if the key is missing/invalid. Setting
      # ENCRYPT_AT_REST=false is an explicit opt-out. See docs/ADMIN_RUNBOOK.md.
      ENCRYPT_AT_REST: ${ENCRYPT_AT_REST:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required - generate with `openssl rand -base64 32`}
      # Optional SAML (see docker-compose.saml.yml)
      AUTH_BOXYHQ_SAML_ISSUER: ${AUTH_BOXYHQ_SAML_ISSUER:-}
      # Read-only accounts (the public demo login) and the AI private-host
      # allowlist. See docs/ADMIN_RUNBOOK.md section 7 before changing.
      DEMO_READONLY_USER_EMAILS: ${DEMO_READONLY_USER_EMAILS:-}
      AI_PRIVATE_HOST_ALLOWLIST: ${AI_PRIVATE_HOST_ALLOWLIST:-}
      AI_ALLOW_ALL_PRIVATE_HOSTS: ${AI_ALLOW_ALL_PRIVATE_HOSTS:-false}
      # Optional: NVD API key (CVE lookups; without it NVD rate-limits to
      # 5 requests per 30 s) and the bearer token that turns on /metrics.
      NVD_API_KEY: ${NVD_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # Frontend Next.js Application
  frontend:
    image: threatforge/frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = use relative URLs, nginx routes /api/* to backend
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
        USE_POSTGRESQL: "true"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Allow self-signed SSL certs (required for AUTH_URL with self-signed cert)
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      # Database configuration (PostgreSQL for production)
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Auth.js configuration
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${DOMAIN}
      # Internal URL for server-side auth calls (avoids external SSL issues)
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Node.js memory settings for 4GB server
      NODE_OPTIONS: "--max-old-space-size=640"
      AUTH_BOXYHQ_SAML_ISSUER: ${AUTH_BOXYHQ_SAML_ISSUER:-}
      AUTH_BOXYHQ_SAML_ID: ${AUTH_BOXYHQ_SAML_ID:-}
      AUTH_BOXYHQ_SAML_SECRET: ${AUTH_BOXYHQ_SAML_SECRET:-}
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - frontend
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # Automated Database Backup (daily at 2 AM)
  backup:
    image: postgres:17-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - backup_data:/backups
    networks:
      - backend
    # Run pg_dump daily at 2 AM, keep 7 days
    entrypoint: /bin/sh
    command: >
      -c 'while true; do
        sleep_until=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -v+1d -v2H -v0M -v0S +%s 2>/dev/null || echo 86400);
        now=$$(date +%s);
        sleep_secs=$$((sleep_until - now));
        if [ $$sleep_secs -le 0 ] || [ $$sleep_secs -gt 86400 ]; then sleep_secs=86400; fi;
        echo "[backup] Next backup in $$sleep_secs seconds";
        sleep $$sleep_secs;
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
        echo "[backup] Starting backup $$TIMESTAMP";
        pg_dump -Fc > /backups/backup_$$TIMESTAMP.dump &&
        echo "[backup] Backup complete: $$(du -h /backups/backup_$$TIMESTAMP.dump | cut -f1)" ||
        echo "[backup] Backup FAILED";
        ls -t /backups/backup_*.dump 2>/dev/null | tail -n +8 | xargs -r rm;
        echo "[backup] Retained: $$(ls /backups/backup_*.dump 2>/dev/null | wc -l) backups";
      done'
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

networks:
  frontend:
  backend:

volumes:
  postgres_data:
  backup_data:
  redis_data:
