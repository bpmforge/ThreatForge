apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowthreat-redis
  labels:
    app: flowthreat
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowthreat
      component: redis
  template:
    metadata:
      labels:
        app: flowthreat
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flowthreat-redis
spec:
  selector:
    app: flowthreat
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
